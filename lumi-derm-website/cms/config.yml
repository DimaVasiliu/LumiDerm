# Lumi Derm — Sveltia CMS configuration
# Iulia edits offers here; saving commits to GitHub and Cloudflare redeploys the site.
#
# BEFORE THIS WORKS you must set two things (see CMS-SETUP.md in the repo root):
#   1. `repo`      -> your GitHub owner/repo
#   2. `base_url`  -> the URL of your deployed sveltia-cms-auth Worker

backend:
  name: github
  repo: DimaVasiliu/LumiDerm        # <-- CHANGE if your repo path differs
  branch: main                       # <-- CHANGE if your default branch differs
  base_url: https://lumiderm-cms-auth.workers.dev   # <-- CHANGE to your auth Worker URL
  commit_messages:
    update: 'Update {{collection}} via CMS'
    delete: 'Delete {{collection}} via CMS'
    uploadMedia: 'Upload {{path}} via CMS'
    deleteMedia: 'Delete {{path}} via CMS'

# Paths are relative to the REPO ROOT (the site is served from ./lumi-derm-website)
media_folder: 'lumi-derm-website/assets/images'
public_folder: 'assets/images'

collections:
  - name: offers
    label: 'Homepage offers'
    files:
      - name: offers
        label: 'Offers'
        file: 'lumi-derm-website/assets/data/offers.json'
        description: >-
          These appear in the "Treatments & offers" section of the homepage.
          Set status to Draft to hide one without deleting it. Offers past their
          end date disappear from the site automatically.
        fields:
          - label: 'Offers'
            name: 'offers'
            widget: 'list'
            label_singular: 'Offer'
            summary: '{{fields.title}} — {{fields.price}}'
            fields:
              - { label: 'Title', name: 'title', widget: 'string', hint: 'e.g. 15% off your first visit' }
              - { label: 'Category', name: 'category', widget: 'string', hint: 'Small label above the title, e.g. New client offer' }
              - { label: 'Short description', name: 'description', widget: 'text' }
              - { label: 'Price', name: 'price', widget: 'string', hint: 'e.g. From £34, £90, Save up to 30%' }
              - { label: 'Badge', name: 'badge', widget: 'string', required: false, hint: 'Small tag on the image, e.g. Save 15%' }
              - { label: 'Image', name: 'image', widget: 'image', hint: 'Upload or pick an image' }
              - label: 'Links to treatment'
                name: 'service'
                widget: 'select'
                required: false
                hint: 'Sends the client straight to this treatment when booking. Leave blank for the general booking page.'
                options:
                  - { label: '— none (general booking) —', value: '' }
                  - { label: 'Laser hair removal', value: 'laser-hair-removal' }
                  - { label: 'Laser skin rejuvenation', value: 'laser-rejuvenation' }
                  - { label: 'Laser vascular / veins', value: 'vascular-treatment' }
                  - { label: 'Electrolysis', value: 'electrolysis' }
                  - { label: 'PRP', value: 'prp' }
                  - { label: 'Profhilo', value: 'profhilo' }
                  - { label: 'Polynucleotides', value: 'polynucleotides' }
                  - { label: 'Mesotherapy', value: 'mesotherapy' }
                  - { label: 'Hair loss treatment', value: 'hair-loss' }
                  - { label: 'Lip boosters', value: 'lip-boosters' }
                  - { label: 'Exosomes', value: 'exosomes' }
                  - { label: 'Facials', value: 'facials' }
                  - { label: 'Facial peels', value: 'facial-peels' }
                  - { label: 'Microneedling', value: 'microneedling' }
                  - { label: 'Endospheres', value: 'endospheres' }
                  - { label: 'Lashes & brows', value: 'lashes-brows' }
              - label: 'Status'
                name: 'status'
                widget: 'select'
                default: 'live'
                options:
                  - { label: 'Live (visible on the website)', value: 'live' }
                  - { label: 'Draft (hidden)', value: 'draft' }
              - { label: 'Featured', name: 'featured', widget: 'boolean', default: false, hint: 'Shows first, with a Featured tag' }
              - label: 'End date'
                name: 'expires'
                widget: 'datetime'
                required: false
                date_format: 'YYYY-MM-DD'
                time_format: false
                format: 'YYYY-MM-DD'
                hint: 'Offer disappears from the site automatically after this date. Leave blank for an ongoing offer.'
              - { label: 'Note (used when there is no end date)', name: 'note', widget: 'string', required: false, hint: 'e.g. Ongoing offer, Always on, Limited time' }
