<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Add your birthday &middot; Lumi Derm Aesthetics</title>
  <link rel="stylesheet" href="../css/style.css?v=20260816-bday1">
</head>
<body class="birthday-page">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="birthday-topbar">
    <a href="/" class="birthday-logo">Lumi Derm Aesthetics</a>
  </header>
  <main id="main-content" class="birthday-main">
    <section class="birthday-card" data-collect-card>
      <p class="eyebrow">One quick thing</p>
      <h1 class="birthday-heading">Add your birthday</h1>
      <p class="birthday-lead">Tell us your birthday and we&rsquo;ll send you 15% off a treatment each year &mdash; our gift to you.</p>
      <form class="birthday-form" data-collect-form novalidate>
        <input type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" class="birthday-hp">
        <div class="birthday-dob">
          <label>Day<select name="birth_day" data-days></select></label>
          <label>Month<select name="birth_month" data-months></select></label>
        </div>
        <button class="btn btn-primary" type="submit">Save my birthday</button>
        <p class="birthday-status" data-collect-status role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="../js/my-birthday.js?v=20260816-bday1" defer></script>
</body>
</html>
