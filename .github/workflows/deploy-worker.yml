name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so the sitemap's <lastmod> dates come from real commits.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the full check suite (syntax + site checks + tests),
      # not just a syntax check, so a failing test cannot ship to production.
      - name: Verify (syntax, site checks, tests)
        run: npm run check

      - name: Lint (JavaScript)
        run: npm run lint:js

      # Regenerate the sitemap so deployed <lastmod> dates are always current.
      - name: Refresh sitemap
        run: npm run sitemap

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
